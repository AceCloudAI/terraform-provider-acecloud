          FAILED=$(grep -c '"Action":"fail"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          SKIPPED=$(grep -c '"Action":"skip"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          echo "| Metric | Count |" >> test-summary.md
          echo "|--------|-------|" >> test-summary.md
          echo "| Passed | $PASSED |" >> test-summary.md
          echo "| Failed | $FAILED |" >> test-summary.md
          echo "| Skipped | $SKIPPED |" >> test-summary.md
          echo "" >> test-summary.md
          if [ "$FAILED" -gt 0 ] 2>/dev/null; then
            echo "### Failed Tests" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="fail" and .Test != null) | "\(.Package)::\(.Test)"' test-report.jsonl 2>/dev/null >> test-summary.md
            echo '```' >> test-summary.md
            echo "" >> test-summary.md
            echo "### Failure Output" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="output" and .Test != null) | .Output // empty' test-report.jsonl 2>/dev/null | grep -i -A2 "FAIL\|Error\|panic" | head -80 >> test-summary.md
            echo '```' >> test-summary.md
