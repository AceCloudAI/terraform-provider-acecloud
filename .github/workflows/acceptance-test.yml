      - name: Exit with test result
        if: always()
        run: exit ${TEST_EXIT_CODE:-1}

  # ──────────────────────────────────────────────────────────────────
  # Summary — collects results from all phases into a PR comment
  # ──────────────────────────────────────────────────────────────────
  summary:
    if: always() && github.event_name == 'pull_request'
    needs:
      - phase-1-foundation
      - phase-2-storage
      - phase-3-compute
      - phase-4-networking
      - phase-5-load-balancing
      - phase-6-autoscaling
      - phase-7-iam
      - phase-8-datasources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const phases = [
              { name: 'Phase 1: Foundation',      job: 'phase-1-foundation',     result: '${{ needs.phase-1-foundation.result }}' },
              { name: 'Phase 2: Storage',          job: 'phase-2-storage',        result: '${{ needs.phase-2-storage.result }}' },
              { name: 'Phase 3: Compute',          job: 'phase-3-compute',        result: '${{ needs.phase-3-compute.result }}' },
              { name: 'Phase 4: Networking',       job: 'phase-4-networking',     result: '${{ needs.phase-4-networking.result }}' },
              { name: 'Phase 5: Load Balancing',   job: 'phase-5-load-balancing', result: '${{ needs.phase-5-load-balancing.result }}' },
              { name: 'Phase 6: Auto-Scaling',     job: 'phase-6-autoscaling',    result: '${{ needs.phase-6-autoscaling.result }}' },
              { name: 'Phase 7: IAM',              job: 'phase-7-iam',            result: '${{ needs.phase-7-iam.result }}' },
              { name: 'Phase 8: Data Sources',     job: 'phase-8-datasources',    result: '${{ needs.phase-8-datasources.result }}' },
            ];

            const icon = r => ({ success: '\u2705', failure: '\u274C', cancelled: '\u23ED\uFE0F', skipped: '\u23ED\uFE0F' }[r] || '\u2753');
            const rows = phases.map(p => `| ${icon(p.result)} | ${p.name} | ${p.result} |`).join('\n');
            const allPassed = phases.every(p => p.result === 'success' || p.result === 'skipped');

            const body = [
              `## ${allPassed ? '\u2705' : '\u274C'} Acceptance Test Results`,
              '',
              '| | Phase | Result |',
              '|---|-------|--------|',
              rows,
              '',
              `> Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '> Download per-phase reports from the **Artifacts** section of the run page.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Acceptance Test Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
