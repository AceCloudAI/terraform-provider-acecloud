            test-summary.md
          retention-days: 14
      - name: Exit with test result
        if: always()
        run: exit ${TEST_EXIT_CODE:-1}

  # ──────────────────────────────────────────────────────────────────
  # Phase 5: Load Balancing — LB, Listener, Pool, Member, Monitor
  # LB pool polls up to 5 min. 5 sub-resources, sequential.
  # ──────────────────────────────────────────────────────────────────
  phase-5-load-balancing:
    needs: phase-4-networking
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '5') ||
