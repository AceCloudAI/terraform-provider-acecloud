name: Acceptance Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      phases:
        description: 'Comma-separated phases to run (1-8), or "all" for everything'
        default: 'all'

concurrency:
  group: acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_ACC: "1"
  CGO_ENABLED: "0"
  ACECLOUD_API_URL: ${{ secrets.ACECLOUD_API_URL }}
  ACECLOUD_API_KEY_ID: ${{ secrets.ACECLOUD_API_KEY_ID }}
  ACECLOUD_API_KEY_SECRET: ${{ secrets.ACECLOUD_API_KEY_SECRET }}
  ACECLOUD_API_KEY_SERVICE_NAME: "terraform-ci"
  ACECLOUD_REGION: ${{ secrets.ACECLOUD_REGION }}
  ACECLOUD_PROJECT_ID: ${{ secrets.ACECLOUD_PROJECT_ID }}
  ACECLOUD_FLAVOR_ID: ${{ secrets.ACECLOUD_FLAVOR_ID }}
  ACECLOUD_IMAGE_ID: ${{ secrets.ACECLOUD_IMAGE_ID }}
  ACECLOUD_EXTERNAL_NETWORK_ID: ${{ secrets.ACECLOUD_EXTERNAL_NETWORK_ID }}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Phase 1: Foundation — VPC, Subnet, Security Group, Key Pair
  # Pure API calls, no long provisioning waits.
  # ──────────────────────────────────────────────────────────────────
  phase-1-foundation:
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '1') ||
      github.event.inputs.phases == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: "Phase 1: Foundation (VPC, Subnet, SG, Key Pair)"
        run: |
          set +e
          go test -v -json -timeout 12m -parallel=2 -count=1 \
            ./internal/resources/vpc/ \
            ./internal/resources/subnet/ \
            ./internal/resources/security_group/ \
            ./internal/resources/key_pair/ \
            2>&1 | tee test-report.jsonl
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Generate summary
        if: always()
        run: |
          echo "## Phase 1: Foundation" > test-summary.md
          echo "" >> test-summary.md
          PASSED=$(grep -c '"Action":"pass"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          FAILED=$(grep -c '"Action":"fail"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          SKIPPED=$(grep -c '"Action":"skip"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          echo "| Metric | Count |" >> test-summary.md
          echo "|--------|-------|" >> test-summary.md
          echo "| Passed | $PASSED |" >> test-summary.md
          echo "| Failed | $FAILED |" >> test-summary.md
          echo "| Skipped | $SKIPPED |" >> test-summary.md
          echo "" >> test-summary.md
          if [ "$FAILED" -gt 0 ] 2>/dev/null; then
            echo "### Failed Tests" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="fail" and .Test != null) | "\(.Package)::\(.Test)"' test-report.jsonl 2>/dev/null >> test-summary.md
            echo '```' >> test-summary.md
            echo "" >> test-summary.md
            echo "### Failure Output" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="output" and .Test != null) | .Output // empty' test-report.jsonl 2>/dev/null | grep -i -A2 "FAIL\|Error\|panic" | head -80 >> test-summary.md
            echo '```' >> test-summary.md
          fi
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-foundation-report
          path: |
            test-report.jsonl
            test-summary.md
          retention-days: 14
      - name: Exit with test result
        if: always()
        run: exit ${TEST_EXIT_CODE:-1}

  # ──────────────────────────────────────────────────────────────────
  # Phase 2: Storage — Volume, Snapshot, Volume Backup
  # Volume creation is fast; backup polling can take a few minutes.
  # ──────────────────────────────────────────────────────────────────
  phase-2-storage:
    needs: phase-1-foundation
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '2') ||
      github.event.inputs.phases == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: "Phase 2: Storage (Volume, Snapshot, Backup)"
        run: |
          set +e
          go test -v -json -timeout 18m -parallel=2 -count=1 \
            ./internal/resources/volume/ \
            ./internal/resources/snapshot/ \
            ./internal/resources/volume_backup/ \
            2>&1 | tee test-report.jsonl
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Generate summary
        if: always()
        run: |
          echo "## Phase 2: Storage" > test-summary.md
          echo "" >> test-summary.md
          PASSED=$(grep -c '"Action":"pass"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          FAILED=$(grep -c '"Action":"fail"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          SKIPPED=$(grep -c '"Action":"skip"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          echo "| Metric | Count |" >> test-summary.md
          echo "|--------|-------|" >> test-summary.md
          echo "| Passed | $PASSED |" >> test-summary.md
          echo "| Failed | $FAILED |" >> test-summary.md
          echo "| Skipped | $SKIPPED |" >> test-summary.md
          echo "" >> test-summary.md
          if [ "$FAILED" -gt 0 ] 2>/dev/null; then
            echo "### Failed Tests" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="fail" and .Test != null) | "\(.Package)::\(.Test)"' test-report.jsonl 2>/dev/null >> test-summary.md
            echo '```' >> test-summary.md
            echo "" >> test-summary.md
            echo "### Failure Output" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="output" and .Test != null) | .Output // empty' test-report.jsonl 2>/dev/null | grep -i -A2 "FAIL\|Error\|panic" | head -80 >> test-summary.md
            echo '```' >> test-summary.md
          fi
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-storage-report
          path: |
            test-report.jsonl
            test-summary.md
          retention-days: 14
      - name: Exit with test result
        if: always()
        run: exit ${TEST_EXIT_CODE:-1}

  # ──────────────────────────────────────────────────────────────────
  # Phase 3: Compute — Instance, Volume Attachment
  # Instance create polls 3 min, power-state 5 min, destroy 5 min.
  # 4 tests sequential = ~20 min worst case.
  # ──────────────────────────────────────────────────────────────────
  phase-3-compute:
    needs: phase-2-storage
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '3') ||
      github.event.inputs.phases == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: "Phase 3: Compute (Instance, Volume Attachment)"
        run: |
          set +e
          go test -v -json -timeout 22m -parallel=1 -count=1 \
            ./internal/resources/instance/ \
            ./internal/resources/volume_attachment/ \
            2>&1 | tee test-report.jsonl
          echo "TEST_EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Generate summary
        if: always()
        run: |
          echo "## Phase 3: Compute" > test-summary.md
          echo "" >> test-summary.md
          PASSED=$(grep -c '"Action":"pass"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          FAILED=$(grep -c '"Action":"fail"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          SKIPPED=$(grep -c '"Action":"skip"' test-report.jsonl 2>/dev/null | grep -v ':' || echo 0)
          echo "| Metric | Count |" >> test-summary.md
          echo "|--------|-------|" >> test-summary.md
          echo "| Passed | $PASSED |" >> test-summary.md
          echo "| Failed | $FAILED |" >> test-summary.md
          echo "| Skipped | $SKIPPED |" >> test-summary.md
          echo "" >> test-summary.md
          if [ "$FAILED" -gt 0 ] 2>/dev/null; then
            echo "### Failed Tests" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="fail" and .Test != null) | "\(.Package)::\(.Test)"' test-report.jsonl 2>/dev/null >> test-summary.md
            echo '```' >> test-summary.md
            echo "" >> test-summary.md
            echo "### Failure Output" >> test-summary.md
            echo '```' >> test-summary.md
            jq -r 'select(.Action=="output" and .Test != null) | .Output // empty' test-report.jsonl 2>/dev/null | grep -i -A2 "FAIL\|Error\|panic" | head -80 >> test-summary.md
            echo '```' >> test-summary.md
          fi
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-compute-report
          path: |
            test-report.jsonl
            test-summary.md
          retention-days: 14
      - name: Exit with test result
        if: always()
        run: exit ${TEST_EXIT_CODE:-1}

  # ──────────────────────────────────────────────────────────────────
  # Phase 4: Networking — Router, Router Interface, Floating IP
  # Neutron calls are fast. FIP Association needs an instance (~3 min).
  # ──────────────────────────────────────────────────────────────────
  phase-4-networking:
    needs: phase-3-compute
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '4') ||
      github.event.inputs.phases == 'all'
