  # ──────────────────────────────────────────────────────────────────
  # Phase 8: Data Sources — read-only listing endpoints
  # No resource creation, just API reads.
  # ──────────────────────────────────────────────────────────────────
  phase-8-datasources:
    needs: phase-7-iam
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '8') ||
      github.event.inputs.phases == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
