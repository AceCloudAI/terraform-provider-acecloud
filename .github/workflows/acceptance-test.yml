  # ──────────────────────────────────────────────────────────────────
  phase-7-iam:
    needs: phase-6-autoscaling
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '7') ||
      github.event.inputs.phases == 'all'
