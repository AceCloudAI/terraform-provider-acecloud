      - name: Exit with test result
        if: always()
        run: exit ${TEST_EXIT_CODE:-1}

  # ──────────────────────────────────────────────────────────────────
  # Phase 6: Auto-Scaling — Template, Deployment
  # Deployment polls up to 10 min for ACTIVE (spawns instances).
  # ──────────────────────────────────────────────────────────────────
  phase-6-autoscaling:
    needs: phase-5-load-balancing
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.inputs.phases, '6') ||
      github.event.inputs.phases == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: "Phase 6: Auto-Scaling (Template, Deployment)"
