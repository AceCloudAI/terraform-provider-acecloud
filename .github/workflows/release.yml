name: release

# Only stable SemVer tags trigger a public Registry release.
# - 'v*.*.*' matches v0.1.0, v1.2.3, etc.
# - '!v*-*' excludes any pre-release suffix (v1.0.0-rc.1, v1.0.0-alpha.1, ...).
# RC / alpha / beta tags should be tested in a separate sandbox repo, not here.
on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Resolve release notes path
        id: notes
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes file $NOTES is missing. Author it before tagging."
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
